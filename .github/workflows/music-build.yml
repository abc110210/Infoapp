name: musiciosapp

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    defaults:
      run:
        # 工程根在 HoshinoPlayer/（内含 project.yml + 源码子目录）
        working-directory: HoshinoPlayer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build (no signing, Release)
        run: |
          xcodebuild \
            -project HoshinoPlayer.xcodeproj \
            -scheme HoshinoPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/HoshinoPlayer.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry HoshinoPlayer-unsigned.ipa Payload
          mv HoshinoPlayer-unsigned.ipa ../../
          ls -lh ../../HoshinoPlayer-unsigned.ipa

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: HoshinoPlayer-unsigned-ipa
          path: HoshinoPlayer/HoshinoPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            HoshinoPlayer/build/DerivedData/Logs/Build/*.xcactivitylog
          retention-days: 7