name: MagicaMonitor
options:
  bundleIdPrefix: com.magica
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  MagicaMonitor:
    type: application
    platform: iOS
    sources:
      - MagicaMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magica.monitor
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MagicaMonitor/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: MagicaMonitor/Info.plist
      properties:
        CFBundleDisplayName: 魔法观测
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - YSHaoShenTi-2.ttf
          - fzrzExtraBold.ttf
          - syht.otf
          - sarasa-mono-sc-bold.ttf
          - gorga.otf
schemes:
  MagicaMonitor:
    build:
      targets:
        MagicaMonitor: all
    run:
      config: Debug
    archive:
      config: Release